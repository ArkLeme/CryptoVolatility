services:
  base:
    build:
      context: ./base
      dockerfile: Dockerfile
    image: hadoop-base:latest
    hostname: base

  namenode:
    build:
      context: ./namenode
      dockerfile: Dockerfile
    image: hadoop-namenode:latest
    depends_on:
      - base
    container_name: namenode
    hostname: namenode
    restart: on-failure
    ports:
      - 9870:9870
      - 9000:9000
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      hadoop_network:
        ipv4_address: 172.20.0.2
    
  datanode:
    build:
      context: ./datanode
      dockerfile: Dockerfile
    image: hadoop-datanode:latest
    depends_on:
      - base
      - namenode
    container_name: datanode
    hostname: datanode
    restart: always
    ports:
      - 9864:9864
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    networks:
      hadoop_network:
        ipv4_address: 172.20.0.3

  resourcemanager:
    build:
      context: ./resourcemanager
      dockerfile: Dockerfile
    image: hadoop-resourcemanager:latest
    depends_on:
      - base
    container_name: resourcemanager
    hostname: resourcemanager
    restart: on-failure
    ports:
      - 8088:8088
    networks:
      hadoop_network:
        ipv4_address: 172.20.0.4

  nodemanager:
    build:
      context: ./nodemanager
      dockerfile: Dockerfile
    image: hadoop-nodemanager:latest
    depends_on:
      - base
      - namenode
      - datanode
      - resourcemanager
    container_name: nodemanager
    hostname: nodemanager
    restart: on-failure
    ports:
      - 8042:8042
    networks:
      hadoop_network:
        ipv4_address: 172.20.0.5
  
  historyserver:
    build:
      context: ./historyserver
      dockerfile: Dockerfile
    image: hadoop-historyserver:latest
    depends_on:
      - base
      - namenode
      - datanode
      - resourcemanager
    container_name: historyserver
    hostname: historyserver
    restart: on-failure
    ports:
      - 8188:8188
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    networks:
      hadoop_network:
        ipv4_address: 172.20.0.6

networks:
  hadoop_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  hadoop_namenode:
  hadoop_datanode:
  hadoop_historyserver: